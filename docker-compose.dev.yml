# =============================================================================
# FindMyFiles Docker Compose - Development Overrides
# =============================================================================
# NOT loaded automatically. Use it together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Dev changes:
#   - backend: uvicorn --reload, source bind-mounted, reloader ignores data/
#   - worker:  code is baked into the image; rebuild or restart after edits
#   - frontend: no bind mount; restart the container after edits
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend - hot-reload for development
  # ---------------------------------------------------------------------------
  backend:
    command: >
      uvicorn backend.app:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
      --reload-exclude 'data/*'
    volumes:
      - ./backend:/app/backend
      - app-data:/app/backend/data

  # ---------------------------------------------------------------------------
  # Worker - no code mount, no reloader (Celery does not auto-reload)
  # ---------------------------------------------------------------------------
  worker:
    command: >
      celery -A backend.celery_app worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=100
    volumes:
      - app-data:/app/backend/data

  # ---------------------------------------------------------------------------
  # Frontend - no code mount (restart the container after edits)
  # ---------------------------------------------------------------------------
  frontend:
    command: >
      python -m frontend.app
